# A public demo of this product next to a production stack on the same box: a second compose
# project with its own database, reached through the production Caddy (caddy/conf.d plus the
# starterdough-proxy network). Run it from the ROOT of a second clone with its own .env:
#
#   git clone <repo> /opt/starterdough-demo && cd /opt/starterdough-demo
#   cp infra/demo/.env.example .env      # COMPOSE_FILE=infra/demo/compose.yml is set in there
#   docker compose build demo-static     # the one image that cannot be production's
#   docker compose pull && docker compose up -d --wait
#
# Runbook, the Caddy site blocks and the reset timer: infra/README.md ("A public demo").
#
# What runs: postgres, migrate, demo-api and demo-web from the images production runs, plus
# demo-static, which serves the marketing site and the docs built for this demo's own origins. No
# caddy of its own (production's terminates TLS and routes both hosts) and no backup (the data is
# wiped on a schedule by reset.sh).
# Memory and CPU are capped well below production's, so a hammered demo runs out of its own share
# long before it competes with production.
name: starterdough-demo

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

# Same convention as compose.yml: the local namespace unless IMAGE_REGISTRY names the registry CI
# pushes to. The demo is meant to pull the images production runs; `up -d --build` builds here.
x-api-image: &api-image
  build:
    context: ../..
    dockerfile: apps/api/Dockerfile
  image: ${IMAGE_REGISTRY:-starterdough}/api:${IMAGE_TAG:-local}

x-hardening: &hardening
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgres://starterdough:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/starterdough
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
  # Two hosts, the split a default deployment of the kit has: the marketing site and the docs on
  # DOMAIN (the docs under /docs), the app and the API together on app.DOMAIN. Sharing one origin
  # with the app is what lets the demo run production's `web` image unchanged: the
  # Content-Security-Policy baked into that image allows 'self', so an api.DOMAIN of its own here
  # would mean building `web` on the box as well.
  API_URL: ${API_URL:-https://app.${DOMAIN:?set DOMAIN in .env}}
  WEB_URL: ${WEB_URL:-https://app.${DOMAIN:?set DOMAIN in .env}}
  # The marketing site is a cross-origin caller: its contact form posts from DOMAIN to the API on
  # app.DOMAIN, and CORS refuses that unless the origin is listed. A row in .env replaces this.
  TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-https://${DOMAIN:?set DOMAIN in .env}}
  # Pinned here rather than read from .env: this stack is a demo by construction, and reset.sh
  # checks the running demo-api for exactly this value before it wipes anything.
  PUBLIC_DEMO_MODE: 'true'
  OTEL_SERVICE_NAME: starterdough-demo-api

services:
  postgres:
    # The image production uses (Postgres 17).
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: starterdough
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: starterdough
    # A quarter of production's: a demo never runs the parallel scans that need more.
    shm_size: 256m
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port: nothing on the box needs this database, and reset.sh works through `exec`.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U starterdough -d starterdough']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1'

  # Applies the migrations and exits; demo-api waits for it. reset.sh relies on `up` running it
  # again against the freshly created database.
  migrate:
    <<: *api-image
    command: ['bun', 'run', 'packages/db/src/migrate.ts']
    restart: 'no'
    logging: *logging
    env_file: ../../.env
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy

  demo-api:
    <<: [*api-image, *hardening]
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 15s
    env_file: ../../.env
    environment:
      <<: *api-env
      PORT: '3000'
      # Behind the production Caddy, which sends exactly one X-Forwarded-For address.
      TRUST_PROXY: 'true'
    # `proxy` is where the production Caddy finds it; `default` is where postgres is.
    networks: [default, proxy]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '2'
          pids: 512

  demo-web:
    <<: *hardening
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the page's Content-Security-Policy. 'self' already covers the API, which
        # shares this origin, and that is why production's image works here unchanged when you
        # pull instead of build.
        PUBLIC_API_URL: ${API_URL:-https://app.${DOMAIN:?set DOMAIN in .env}}
    image: ${IMAGE_REGISTRY:-starterdough}/web:${IMAGE_TAG:-local}
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOST: 0.0.0.0
      ORIGIN: ${WEB_URL:-https://app.${DOMAIN:?set DOMAIN in .env}}
      PUBLIC_API_URL: ${API_URL:-https://app.${DOMAIN:?set DOMAIN in .env}}
      # Internal API origin for SSR
      API_URL: http://demo-api:3000
      # The banner and noindex. Read at run time; pinned for the same reason as in x-api-env.
      PUBLIC_DEMO_MODE: 'true'
    networks: [default, proxy]
    depends_on:
      demo-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '1'
          pids: 512

  # The marketing site and the docs: the two surfaces the app is not. Dockerfile.static compiles
  # SITE_URL, DOCS_URL, PUBLIC_APP_URL and PUBLIC_API_URL into
  # every page, so production's `caddy` image would serve the demo a site whose every link points
  # at production. CI publishes this demo-specific image for routine deploys; retaining `build:`
  # lets self-hosters build it locally when they do not publish images from GitHub Actions.
  demo-static:
    <<: *hardening
    # The caddy image ships its binary with the file capability `cap_net_bind_service=ep`, and the
    # kernel refuses to execve a file whose permitted set is not inside the bounding set. With
    # `cap_drop: ALL` alone the container crash-loops on `exec /usr/bin/caddy: operation not
    # permitted`, whatever ports it listens on. Same reason production's caddy adds it back.
    cap_add: [NET_BIND_SERVICE]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.static
      args:
        SITE_URL: ${SITE_URL:-https://${DOMAIN:?set DOMAIN in .env}}
        # A path, not a host of its own: the docs are served under /docs on the same origin, and
        # Astro takes that path as the base every link and asset carries (apps/docs/astro.config.mjs).
        DOCS_URL: ${DOCS_URL:-https://${DOMAIN:?set DOMAIN in .env}/docs}
        PUBLIC_APP_URL: ${WEB_URL:-https://app.${DOMAIN:?set DOMAIN in .env}}
        PUBLIC_API_URL: ${API_URL:-https://app.${DOMAIN:?set DOMAIN in .env}}
    image: ${IMAGE_REGISTRY:-starterdough}/demo-static:${IMAGE_TAG:-local}
    restart: unless-stopped
    logging: *logging
    environment:
      # The contact form's origin, interpolated into the site's Content-Security-Policy.
      API_URL: ${API_URL:-https://app.${DOMAIN:?set DOMAIN in .env}}
    volumes:
      - ./caddy/demo-static.Caddyfile:/etc/caddy/Caddyfile:ro
    # Only the proxy network: it serves the production Caddy and talks to nothing else.
    networks: [proxy]
    healthcheck:
      # Caddy's admin API listens on localhost inside the container; a 200 means the config loaded.
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '1'
          pids: 512

networks:
  # The production Caddy joins it through compose.proxy-network.yml. Created once by hand
  # (`docker network create starterdough-proxy`); `external` means neither project removes it.
  proxy:
    external: true
    name: ${PROXY_NETWORK:-starterdough-proxy}

volumes:
  pgdata:
