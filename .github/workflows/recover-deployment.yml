name: Recover deployment

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Inspect the journal, or recover using its recorded phase and release.'
        type: choice
        options: [status, recover]
        default: status
      target:
        description: 'The checkout whose deployment was interrupted.'
        type: choice
        options: [production, demo]
        default: production

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3.3.0
        if: vars.DEPLOY_VIA_TAILSCALE == 'true'
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Recover the recorded deployment without changing its checkout
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/starterdough' }}
          DEMO_PATH: ${{ vars.DEMO_PATH }}
          RECOVERY_ACTION: ${{ inputs.action }}
          RECOVERY_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          umask 077
          case "$RECOVERY_ACTION" in status|recover) ;; *) exit 1 ;; esac
          case "$RECOVERY_TARGET" in
            production) checkout="$DEPLOY_PATH" ;;
            demo) checkout="$DEMO_PATH" ;;
            *) exit 1 ;;
          esac
          [[ "$checkout" = /* && "$checkout" != *$'\n'* ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          key="$RUNNER_TEMP/deployment-recovery-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          chmod 600 "$key"
          # The server already holds the candidate code and images. Fetching or checking out
          # another revision here could replace the only safe recovery implementation.
          printf -v remote 'set -euo pipefail; cd %q; bash infra/scripts/recover-deployment.sh %q' \
            "$checkout" "$RECOVERY_ACTION"
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote" </dev/null \
            | tee "$RUNNER_TEMP/deployment-recovery.log"
          if [ "$RECOVERY_ACTION" = status ]; then
            grep -Eq '^deployment_recovery_pending=(true|false)$' "$RUNNER_TEMP/deployment-recovery.log"
          else
            grep -Fxq deployment_recovery_complete "$RUNNER_TEMP/deployment-recovery.log"
          fi
