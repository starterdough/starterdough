# Container images + (optional) deploy to your server.
#
# Off until you switch it on. A new repository has no server and none of the variables below, so
# until the repository variable DEPLOY_ENABLED is `true` every run of this workflow is one short job
# that says how to switch it on: nothing is built, nothing is deployed, and nothing goes red.
#
# Once it is on, production follows CI. When the CI workflow (.github/workflows/ci.yml) passes for a
# push to `main`, this builds the five images behind infra/compose.yml from that exact commit, plus
# demo-static when DEMO_PATH enables the public demo, and pushes them to GitHub Container Registry as
# ghcr.io/<owner>/<repo>/<name>:<tag>, tagged with the commit (`sha-abc1234`), `main` and `latest`.
# A `v*` tag builds the same images tagged with the commit and the version (`1.2.0`), for a later
# rollback by version, and deploys nothing. Nothing to configure for the registry: GITHUB_TOKEN may
# push to this repository's packages. They are private until you make them public (repository →
# Packages → package settings) or `docker login ghcr.io` on the server.
#
# Then, when the repository *variable* DEPLOY_HOST is set, it deploys over SSH: it pushes the commit
# into the server's checkout and runs infra/scripts/deploy.sh there (checkout of this commit,
# `docker compose pull`, `up -d`, readiness check). Variables (Settings → Secrets and variables →
# Actions → Variables):
#   DEPLOY_ENABLED        `true` switches this workflow on. Set it last, once the rest is in place
#                         (infra/README.md, "Deploy, update, roll back", lists the order). On without
#                         DEPLOY_HOST, it builds and pushes the images and deploys nothing.
#   DEPLOY_HOST           the server (hostname, IP, or its tailnet name)
#   DEPLOY_USER           SSH user, default `deploy` (infra/scripts/provision.sh creates it)
#   DEPLOY_PATH           the clone on the server, default /opt/starterdough
#   DEMO_PATH             optional: the public demo's clone on the same box (infra/README.md, "A
#                         public demo"). Set it and every deploy also moves the demo onto the build
#                         being released, so what visitors try is what you ship; unset, the demo
#                         is never touched.
#   DEMO_DOMAIN           required with DEMO_PATH: the demo's base host, such as demo.example.com.
#   DEMO_SITE_URL DEMO_DOCS_URL DEMO_WEB_URL DEMO_API_URL
#                         optional overrides for the URLs baked into demo-static; each defaults from
#                         DEMO_DOMAIN using the standard demo topology documented in infra/README.md.
#   DEPLOY_VIA_TAILSCALE  'true' when the server is reachable only over your tailnet
#   IMAGE_PLATFORMS       default linux/amd64; add linux/arm64 for an ARM VPS (slower builds via QEMU)
#   SITE_URL DOCS_URL WEB_URL API_URL   REQUIRED: baked into the static sites (caddy image) at build
#                         time, and API_URL also into the app's Content-Security-Policy (web image).
#                         The `caddy` image fails the build while any of them is unset rather
#                         than shipping example.com URLs to your visitors.
# Secrets:
#   DEPLOY_SSH_KEY        private key whose public half is in the deploy user's authorized_keys
#   SOPS_AGE_KEY          optional: decrypts infra/env/production.enc.env into the server's .env first
#   GHCR_PULL_TOKEN       optional: a PAT with `read:packages` used to log the server into GHCR. Without
#                         it the job's own GITHUB_TOKEN is used; it works for this deploy but expires
#                         with the job, so a `docker compose pull` by hand later needs its own login
#                         (a PAT, or public packages).
#   TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET   optional: a Tailscale OAuth client (tag:ci) for DEPLOY_VIA_TAILSCALE
#
# No deploy key and no token on the server: it never fetches from GitHub. The runner already holds
# the commit being released and an SSH login to the box, so it pushes that commit into the checkout
# (the "Deliver" step). A private repository therefore deploys exactly like a public one.
#
# Why `workflow_run` rather than `push`: a push-triggered deploy starts alongside CI, so a commit
# whose tests, audit or database checks fail would be built, and its migrations run against
# production, before CI had said a word. `workflow_run` starts once CI has finished, and the plan job
# releases only a passing run of a push to this repository's `main` whose commit is still the tip of
# `main`. GitHub runs the copy of this file on the default branch, with this repository's secrets,
# so it never checks out anything but that commit (`workflow_run.head_sha`; `github.sha` on this
# event is merely wherever `main` points). Pull requests release nothing: their CI runs are
# `pull_request` events, including a fork's whose branch is also called `main`.
#
# The deploy also passes IMAGE_REGISTRY (this repository's own GHCR namespace, lowercased) to
# deploy.sh, which pins it in the server's .env, so a fork never edits that row by hand.
#
# SSH host keys are accepted on first use (`StrictHostKeyChecking accept-new`). Pinning the key would
# mean a repository variable to update on every rebuild of the box; accept-new still refuses a
# changed key, which is the attack that matters after the first deploy.
#
# Every third-party action is pinned to a full commit SHA (version in the trailing comment). This job
# holds SOPS_AGE_KEY, which decrypts every production secret, so a moving tag like `@v3` (whatever
# that repository points it at when the job starts) is not an acceptable dependency here.
# The pins move with each release of the kit (UPGRADING.md). A fork that wants them bumped sooner
# can add a .github/dependabot.yml for the `github-actions` ecosystem.
#
# Rollback: run the workflow by hand (Actions → Deploy → Run workflow) with `tag` set to a previous
# `sha-…` (or a released version like `1.2.0`): the build is skipped and that tag is deployed, with
# the matching commit checked out on the server. With `tag` empty, a run by hand builds and deploys
# the commit it was started from. Either way it deploys only a commit CI passed on a push to `main`,
# and refuses anything else before building or touching the server. Preview environments per PR are
# not part of this workflow; Coolify/Dokploy (or a second compose project per branch) do that well.

name: Deploy

on:
  workflow_run:
    # The `name:` of .github/workflows/ci.yml. The plan job looks the same workflow up by file name,
    # so renaming either means editing both.
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing image tag to deploy (e.g. sha-abc1234). Empty = build this commit first.'
        required: false
        default: ''

concurrency:
  # Releases queue one at a time and a newer release replaces one still waiting. Only a run that can
  # deploy joins that queue (the plan job's rules, as far as this context can see them). A run for a
  # failed CI run, a pull request, a superseded commit or a `v*` tag, or one with deployment switched
  # off, changes nothing on the server, and in the shared group it would displace a green commit
  # still waiting its turn. .github/workflows/recover-deployment.yml shares the group.
  group: >-
    ${{ vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' ||
    (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
    github.event.workflow_run.head_sha == github.sha)) && 'deploy-production' ||
    format('deploy-{0}', github.run_id) }}
  cancel-in-progress: false

# Per job below: only the two image-building jobs may write packages.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  # Decides, before anything is built, whether this run builds, deploys, or only says why not. Every
  # run has this job and nothing else is unconditional, so a run that releases nothing is one green
  # job with a notice.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lists CI's runs for a commit: a run by hand deploys only what CI passed.
      actions: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      deploy: ${{ steps.plan.outputs.deploy }}
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        # Only a requested tag needs the history: `1.2.0` resolves through its git tag, and an
        # abbreviated `sha-…` to the full commit id the CI lookup and the server need.
        if: vars.DEPLOY_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.tag != ''
        with:
          fetch-depth: 0
      - id: plan
        name: Decide what this run releases
        # Everything comes through env, never `${{ }}` inside the script (the tag input is free text).
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          REQUESTED: ${{ inputs.tag }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          build=false
          deploy=false
          sha=
          tag=
          finish() {
            printf 'build=%s\ndeploy=%s\nsha=%s\ntag=%s\n' "$build" "$deploy" "$sha" "$tag" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$DEPLOY_ENABLED" != true ]; then
            off='Deployment is switched off, so this workflow builds and deploys nothing. Switch it on with the repository variable DEPLOY_ENABLED=true (Settings → Secrets and variables → Actions → Variables) once the server, the variables and the secrets infra/README.md lists under "Deploy, update, roll back" are in place.'
            # The expressions above compare without case and this check with it, so `True` is off;
            # say so rather than leave it a mystery.
            case "$DEPLOY_ENABLED" in
              [Tt][Rr][Uu][Ee]) off="$off It is set to '$DEPLOY_ENABLED': only a lowercase true switches it on." ;;
            esac
            # Asked for by hand, silence would read as success.
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "::error title=Deployment is switched off::$off"
              exit 1
            fi
            echo "::notice title=Deployment is switched off::$off"
            finish
          fi

          case "$GITHUB_EVENT_NAME" in
            workflow_run)
              if [ "$CI_CONCLUSION" != success ] || [ "$CI_EVENT" != push ] || [ "$CI_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
                echo "::notice title=Nothing to release::CI ended '$CI_CONCLUSION' for a $CI_EVENT of ${CI_SHA:0:7}. Only a passing CI run of a push to main is built and deployed."
                finish
              fi
              # Only main's tip is released. A newer commit is released by its own CI run; releasing
              # this one now could only take production backwards, which is what a re-run of an old CI
              # run, or of an old Deploy run, would otherwise do. The tip comes from the API, not from
              # GITHUB_SHA: that is fixed when the event is created, and a re-run replays it. Roll back
              # on purpose with the tag input.
              tip="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha || true)"
              if ! [[ "$tip" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error title=Cannot read main::GitHub did not say which commit main points at, so ${CI_SHA:0:7} is not released. Re-run this job, or Run workflow once main is readable."
                exit 1
              fi
              if [ "$CI_SHA" != "$tip" ]; then
                echo "::notice title=Superseded::main has moved on from ${CI_SHA:0:7} to ${tip:0:7}, which its own CI run releases once it passes. A push CI skips ([skip ci]) gets no such run: push again to release main."
                finish
              fi
              sha="$CI_SHA"
              build=true
              deploy=true
              ;;
            push)
              # A `v*` tag. Its commit reached production, or not, through main's own CI run.
              sha="$GITHUB_SHA"
              build=true
              ;;
            workflow_dispatch)
              if [ -n "$REQUESTED" ]; then
                # Image tags are [A-Za-z0-9._-] and never start with `-` (it would become an option).
                case "$REQUESTED" in *[!A-Za-z0-9._-]*|-*) echo "invalid tag: $REQUESTED" >&2; exit 1 ;; esac
                tag="$REQUESTED"
                # The server checks out the commit the images were built from, so the compose file,
                # the migrations and the images always match.
                case "$REQUESTED" in
                  sha-*)
                    ref="${REQUESTED#sha-}"
                    case "$ref" in ''|*[!0-9a-f]*) echo "invalid sha tag: $REQUESTED" >&2; exit 1 ;; esac
                    ;;
                  *)
                    # A released version (`1.2.0`, pushed as git tag `v1.2.0`): resolve it to its commit.
                    git fetch --quiet --tags --force origin
                    ref="$(git rev-list -n1 "refs/tags/v$REQUESTED" 2>/dev/null || true)"
                    [ -n "$ref" ] || ref="$(git rev-list -n1 "refs/tags/$REQUESTED" 2>/dev/null || true)"
                    if [ -z "$ref" ]; then
                      echo "::error title=Cannot resolve the requested tag::'$REQUESTED' is neither a sha-<commit> image tag nor a git tag in this repository, so there is no commit to deploy alongside it. Deploying it would run the current main against those images. Use the sha-<commit> tag of the build you want (Packages → the api image), or a version tag such as 1.2.0."
                      exit 1
                    fi
                    ;;
                esac
                sha="$(git rev-parse --verify --quiet "$ref^{commit}" || true)"
                if [ -z "$sha" ]; then
                  echo "::error title=Unknown commit::'$REQUESTED' names no single commit in this repository."
                  exit 1
                fi
              else
                sha="$GITHUB_SHA"
                build=true
              fi
              deploy=true
              # CI runs on pushes to main (and pull requests), so a passing push run means the commit
              # was on main and green. Fail closed on anything but a positive count.
              passed="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
                -f head_sha="$sha" -f event=push -f branch=main -f status=success -f per_page=1 \
                --jq .total_count)"
              case "$passed" in
                ''|0|*[!0-9]*)
                  echo "::error title=CI has not passed for this commit::${sha:0:7} has no successful CI run for a push to main, so it is not deployed. A commit still in CI deploys by itself once CI passes; to roll back, pick a sha-… tag that was deployed before."
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "unexpected event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "unexpected commit id: $sha" >&2; exit 1; }
          # Spelled out rather than docker/metadata-action's `type=sha`, which tags `github.sha`:
          # after a CI run that is wherever main points, not necessarily the commit built here.
          [ -n "$tag" ] || tag="sha-${sha:0:7}"
          if [ "$deploy" = true ] && [ -z "$DEPLOY_HOST" ]; then
            if [ "$build" != true ]; then
              echo "::error title=No server to deploy to::Set the repository variable DEPLOY_HOST to deploy an existing tag."
              exit 1
            fi
            deploy=false
            echo "::notice title=Images only::DEPLOY_HOST is not set, so this run builds and pushes the images and deploys nothing."
          fi
          finish

  images:
    name: Image (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: apps/api/Dockerfile
          - name: web
            context: .
            dockerfile: apps/web/Dockerfile
            # The app's Content-Security-Policy is baked from these (see apps/web/Dockerfile).
            # Without API_URL the policy keeps its localhost default and the browser blocks every
            # call the app makes to the API. The optional four only widen the policy when that
            # integration is switched on.
            build_args: |
              PUBLIC_API_URL=${{ vars.API_URL }}
              PUBLIC_STORAGE_ORIGIN=${{ vars.PUBLIC_STORAGE_ORIGIN }}
              PUBLIC_SENTRY_DSN=${{ vars.PUBLIC_SENTRY_DSN }}
              PUBLIC_POSTHOG_KEY=${{ vars.PUBLIC_POSTHOG_KEY }}
              PUBLIC_POSTHOG_HOST=${{ vars.PUBLIC_POSTHOG_HOST }}
          - name: caddy
            context: .
            dockerfile: infra/docker/Dockerfile.static
            # The static sites bake their canonical URLs at build time. No fallbacks; see the
            # guard step below.
            build_args: |
              SITE_URL=${{ vars.SITE_URL }}
              DOCS_URL=${{ vars.DOCS_URL }}
              PUBLIC_APP_URL=${{ vars.WEB_URL }}
              PUBLIC_API_URL=${{ vars.API_URL }}
          - name: backup
            context: .
            dockerfile: infra/backup/Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The commit the plan chose, never `github.sha`: after a CI run that is wherever main
          # points by now.
          ref: ${{ needs.plan.outputs.sha }}
      - name: The static sites need their canonical URLs
        if: matrix.name == 'caddy'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          DOCS_URL: ${{ vars.DOCS_URL }}
          WEB_URL: ${{ vars.WEB_URL }}
          API_URL: ${{ vars.API_URL }}
        run: |
          missing=
          for name in SITE_URL DOCS_URL WEB_URL API_URL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing repository variables::Set$missing under Settings → Secrets and variables → Actions → Variables. They are baked into the marketing site and the docs when this image is built (canonical URLs, sitemap, RSS, the origins the pages link to and call), so they cannot be changed afterwards — and defaulting them to example.com would publish someone else's domain."
            exit 1
          fi
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        if: vars.IMAGE_PLATFORMS != '' && vars.IMAGE_PLATFORMS != 'linux/amd64'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.name }}
          # The commit tag and the revision label come from the plan (see `tag` there).
          tags: |
            type=raw,value=${{ needs.plan.outputs.tag }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: ${{ matrix.build_args }}

  demo-image:
    name: Image (demo-static)
    needs: plan
    if: needs.plan.outputs.build == 'true' && vars.DEMO_PATH != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: The public demo image needs its canonical domain
        env:
          DEMO_DOMAIN: ${{ vars.DEMO_DOMAIN }}
        run: |
          if [ -z "$DEMO_DOMAIN" ]; then
            echo "::error title=Missing repository variable::Set DEMO_DOMAIN under Settings → Secrets and variables → Actions → Variables. It is required when DEMO_PATH enables the public demo and supplies the defaults for the URLs compiled into demo-static."
            exit 1
          fi
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        if: vars.IMAGE_PLATFORMS != '' && vars.IMAGE_PLATFORMS != 'linux/amd64'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/demo-static
          tags: |
            type=raw,value=${{ needs.plan.outputs.tag }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/docker/Dockerfile.static
          platforms: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=demo-static
          cache-to: type=gha,mode=max,scope=demo-static
          build-args: |
            SITE_URL=${{ vars.DEMO_SITE_URL || format('https://{0}', vars.DEMO_DOMAIN) }}
            DOCS_URL=${{ vars.DEMO_DOCS_URL || format('https://{0}/docs', vars.DEMO_DOMAIN) }}
            PUBLIC_APP_URL=${{ vars.DEMO_WEB_URL || format('https://app.{0}', vars.DEMO_DOMAIN) }}
            PUBLIC_API_URL=${{ vars.DEMO_API_URL || format('https://app.{0}', vars.DEMO_DOMAIN) }}

  deploy:
    name: Deploy to ${{ vars.DEPLOY_HOST }}
    needs: [plan, images, demo-image]
    # Runs after a successful build, or straight away when an existing tag was requested.
    if: |
      always() && needs.plan.result == 'success' && needs.plan.outputs.deploy == 'true' &&
      (needs.images.result == 'success' || needs.images.result == 'skipped') &&
      (needs.demo-image.result == 'success' || needs.demo-image.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      # So the fallback GITHUB_TOKEN may log the server into GHCR and pull the images.
      packages: read
    # Everything a `run:` needs comes through env, never `${{ }}` inside the script: the values reach
    # `ssh target "…"` and `git checkout`, so they must be shell-quoted, not templated.
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/starterdough' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The released commit after a CI run; a run by hand keeps the commit it was started from,
          # whose infra/env/production.enc.env is the current one, even when rolling back.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Full history: the release commit is pushed to the server from here, and a rollback's
          # is older than the one checked out.
          fetch-depth: 0
      - name: Log the runner into GHCR for demo rollback validation
        if: vars.DEMO_PATH != '' && github.event_name == 'workflow_dispatch' && inputs.tag != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify an existing tag includes the public demo image
        if: vars.DEMO_PATH != '' && github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          IMAGE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          IMAGE_REGISTRY="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image="$IMAGE_REGISTRY/demo-static:$IMAGE_TAG"
          if ! docker manifest inspect "$image" >/dev/null; then
            echo "::error title=The requested tag has no public demo image::$image is unavailable. Production has not been touched. Publish a demo-static image for this tag, unset DEMO_PATH for a production-only rollback, or follow infra/README.md's explicit BUILD_DEMO_STATIC=1 self-host fallback outside this workflow."
            exit 1
          fi
      - uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3.3.0
        if: vars.DEPLOY_VIA_TAILSCALE == 'true'
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # StrictHostKeyChecking=accept-new: trust the host key on first use, refuse it if it ever
          # changes. Pinning it would mean a repository variable to update every time the box is
          # rebuilt, and the runner reaches the host over the tailnet or a known IP.
          printf 'Host target\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  BatchMode yes\n  IdentitiesOnly yes\n  ConnectTimeout 15\n  ServerAliveInterval 15\n  ServerAliveCountMax 6\n  StrictHostKeyChecking accept-new\n' \
            "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config
      - name: Refuse a new release while deployment recovery is pending
        run: |
          ssh target 'set -euo pipefail
            state_dir="${STARTERDOUGH_STATE_DIR:-$HOME/.local/state/starterdough}"
            mkdir -p "$state_dir"
            chmod 700 "$state_dir"
            exec 8>"$state_dir/operations.lock"
            flock -w 1800 8
            if [ -e "$state_dir/deployment-interrupted" ] || [ -L "$state_dir/deployment-interrupted" ]; then
              echo "deployment recovery is pending; use the Recover deployment workflow before starting another release" >&2
              exit 1
            fi'
      - name: Deliver the release commit to the server
        env:
          GIT_REF: ${{ needs.plan.outputs.sha }}
          DEMO_PATH: ${{ vars.DEMO_PATH }}
        run: |
          # The server never fetches from GitHub: on a private repository that would need a
          # credential on the box (a deploy key or a token) for every owner to create, store and
          # rotate. This runner holds the commit and an SSH login to the server, so it pushes the
          # commit into each checkout under a ref of its own. That touches neither HEAD nor the
          # working tree, so nothing changes until the Deploy step checks it out under the host lock.
          set -euo pipefail
          for checkout in "$DEPLOY_PATH" "$DEMO_PATH"; do
            [ -n "$checkout" ] || continue
            git push --quiet --force "target:$checkout" "$GIT_REF:refs/starterdough/release"
          done
      - name: Ship the environment file (only when SOPS_AGE_KEY is set)
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          # Pinned, and verified against the release's own checksum file before it runs: this binary
          # gets to see every production secret.
          SOPS_VERSION: v3.13.3
        run: |
          if [ -z "$SOPS_AGE_KEY" ] || [ ! -f infra/env/production.enc.env ]; then
            echo "no SOPS_AGE_KEY or no infra/env/production.enc.env — the server keeps its .env"; exit 0
          fi
          base="https://github.com/getsops/sops/releases/download/$SOPS_VERSION"
          binary="sops-$SOPS_VERSION.linux.amd64"
          cd "$RUNNER_TEMP"
          curl -fsSL -o "$binary" "$base/$binary"
          curl -fsSL -o checksums.txt "$base/sops-$SOPS_VERSION.checksums.txt"
          # The file lists every platform; check only the line for the binary we downloaded.
          grep " $binary\$" checksums.txt | sha256sum -c -
          sudo install -m 755 "$binary" /usr/local/bin/sops
          cd "$GITHUB_WORKSPACE"
          sops --decrypt --input-type dotenv --output-type dotenv infra/env/production.enc.env > /tmp/.env
          # Written over stdin and locked to the owner in the same hop (secrets: never world-readable).
          # shellcheck disable=SC2029  # $DEPLOY_PATH expands here on purpose, single-quoted for the remote shell
          ssh target "set -euo pipefail
            state_dir=\"\${STARTERDOUGH_STATE_DIR:-\$HOME/.local/state/starterdough}\"
            mkdir -p \"\$state_dir\"
            chmod 700 \"\$state_dir\"
            exec 8>\"\$state_dir/operations.lock\"
            flock -w 1800 8
            if [ -e \"\$state_dir/deployment-interrupted\" ] || [ -L \"\$state_dir/deployment-interrupted\" ]; then
              echo 'deployment recovery is pending; environment unchanged' >&2
              exit 1
            fi
            mkdir -p '$DEPLOY_PATH'
            cat > '$DEPLOY_PATH/.env'
            chmod 600 '$DEPLOY_PATH/.env'" < /tmp/.env
          rm -f /tmp/.env
      - name: Log the server into GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          # A PAT with read:packages if you set one, else this job's token, which expires when the job
          # ends, so a later `docker compose pull` by hand needs its own login (see infra/README.md).
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || github.token }}
        run: |
          # shellcheck disable=SC2029  # $GHCR_USER expands here on purpose, single-quoted for the remote shell
          printf '%s\n' "$GHCR_TOKEN" | ssh target "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
      - name: Deploy
        env:
          IMAGE_TAG: ${{ needs.plan.outputs.tag }}
          GIT_REF: ${{ needs.plan.outputs.sha }}
          DEMO_PATH: ${{ vars.DEMO_PATH }}
        run: |
          # GHCR namespaces are lowercase; github.repository keeps the owner's casing.
          IMAGE_REGISTRY="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          # Hold one host fence before either checkout. The demo updates first so a failed demo
          # leaves production on its prior healthy release, and both scripts inherit FD 8.
          ssh target "set -euo pipefail
            state_dir=\"\${STARTERDOUGH_STATE_DIR:-\$HOME/.local/state/starterdough}\"
            mkdir -p \"\$state_dir\"
            chmod 700 \"\$state_dir\"
            exec 8>\"\$state_dir/operations.lock\"
            flock -w 1800 8
            export STARTERDOUGH_OPERATION_LOCK_HELD=1
            if [ -e \"\$state_dir/deployment-interrupted\" ] || [ -L \"\$state_dir/deployment-interrupted\" ]; then
              echo 'deployment recovery is pending; use Recover deployment before deploying' >&2
              exit 1
            fi
            cd '$DEPLOY_PATH'
            for path in infra/scripts/operation-lock.sh infra/scripts/deployment-recovery.py infra/scripts/deployment-recovery.sh infra/scripts/recover-deployment.sh; do
              git cat-file -e '$GIT_REF':\$path
            done
            git show '$GIT_REF:infra/scripts/deploy.sh' | grep -F 'deployment-recovery.sh' >/dev/null
            if [ -n '$DEMO_PATH' ]; then
              git show '$GIT_REF:infra/demo/update.sh' | grep -F 'deployment-recovery.sh' >/dev/null
              git show '$GIT_REF:infra/demo/reset.sh' | grep -F 'deployment-recovery.sh' >/dev/null
              git -C '$DEMO_PATH' checkout --quiet --detach '$GIT_REF'
              (cd '$DEMO_PATH' && IMAGE_REGISTRY='$IMAGE_REGISTRY' IMAGE_TAG='$IMAGE_TAG' GIT_REF='' bash infra/demo/update.sh)
            fi
            git checkout --quiet --detach '$GIT_REF'
            source infra/scripts/operation-lock.sh
            acquire_operation_lock
            IMAGE_REGISTRY='$IMAGE_REGISTRY' IMAGE_TAG='$IMAGE_TAG' GIT_REF='' bash infra/scripts/deploy.sh"
