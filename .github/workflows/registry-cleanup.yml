# Weekly: drop old images from this repository's GitHub Container Registry packages, which otherwise
# grow by one set of images per release and count against the account's storage. It keeps every
# version tag (`1.2.0`, from a `v*` tag), `latest`, `main`, the 20 newest other tagged builds
# (`sha-…`) of each image, and every untagged manifest a kept image still needs: the action
# understands multi-platform images and build attestations. A rollback to a build older than the
# newest 20 fails at its pull, so roll back that far by version tag. The server keeps its own three
# newest local builds of each image (infra/scripts/deploy.sh).
#
# Off with deployment: it runs only while DEPLOY_ENABLED is `true`. Run it by hand first, with
# `dry-run` (the default there), to see what it would delete. It needs no secret: GITHUB_TOKEN can
# delete versions of a package this repository's workflows created, which is every package
# deploy.yml pushes, and the action stops with an error on any other.
name: Registry cleanup

on:
  schedule:
    - cron: '17 4 * * 0'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'List what would be deleted, and delete nothing.'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: registry-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: packages
        name: The images this repository publishes
        run: |
          # ghcr.io/<owner>/<repo>/<image> is the package <repo>/<image>. Naming a package that was
          # never published fails the action, and not every repository publishes every image (no
          # public demo, no demo-static), so the list is what exists.
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          list=
          for image in api web ai caddy backup demo-static; do
            if docker manifest inspect "ghcr.io/$repository/$image:latest" >/dev/null 2>&1; then
              list="$list${list:+,}${repository#*/}/$image"
            fi
          done
          echo "packages=$list" >> "$GITHUB_OUTPUT"
          [ -n "$list" ] || echo "::notice title=Nothing to clean::No image of this repository has been published yet."
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        if: steps.packages.outputs.packages != ''
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: ${{ steps.packages.outputs.packages }}
          keep-n-tagged: 20
          exclude-tags: '^(latest|main|v?\d+\.\d+\.\d+.*)$'
          use-regex: true
          delete-untagged: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
